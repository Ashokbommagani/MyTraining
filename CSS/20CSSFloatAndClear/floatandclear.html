<!DOCTYPE html>
<html>
    <head>
        <title>float and clear css</title>
        <style>
            img{
                height:500px;
                width:500px;
                float:left;
            }
            p{
                clear:left;
            }
        </style>
    </head>
    <body>
        <img src="nature.jpg" alt="my image" />
        <p>This is nature image nature is beautiful</p>
    </body>
</html>
